<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Do You Love Me? ❤️</title>
</head>

<body>

    <!-- Floating hearts -->
    <div class="floating-heart" style="left: 10%; animation-delay: 0s;">❤️</div>
    <div class="floating-heart" style="left: 25%; animation-delay: 2s;">💕</div>
    <div class="floating-heart" style="left: 45%; animation-delay: 4s;">❤️</div>
    <div class="floating-heart" style="left: 70%; animation-delay: 1s;">💕</div>
    <div class="floating-heart" style="left: 90%; animation-delay: 3s;">❤️</div>
    <div class="floating-heart" style="left: 55%; animation-delay: 0s;">💖</div>


    <!-- Main content -->
    <div class="container">

        <div class="heart">♡</div>

        <h1>Do you love me?</h1>

        <div class="buttons">

            <button class="yes">♥ YES</button>

            <button class="no">✕ NO</button>

        </div>

    </div>


    <!-- Video reveal -->
    <div class="video-container">

        <video id="loveVideo" playsinline>

            <source
                src="
                1790754541291.mp4"
                type="video/mp4">

        </video>


        <!-- Final romantic message -->
        <div class="final-message">

            <p>
                If this moment could last forever,
                I’d spend forever right here with you. ❤️
            </p>

            <button class="replay">
                ↻ Experience Again
            </button>

        </div>

    </div>


    <script
        type="text/javascript"
        src="main.js">
    </script>

</body>

</html>
